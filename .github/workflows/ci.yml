# CI — validate compose, build image, smoke (tiny model), shellcheck.
# No repository secrets required.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: tools-transcript-ci
      STACK_SUFFIX: ci
      WHISPER_MODEL: tiny
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=tools-transcript-ci/' .env
          sed -i 's/^STACK_SUFFIX=.*/STACK_SUFFIX=ci/' .env
          sed -i 's/^WHISPER_MODEL=.*/WHISPER_MODEL=tiny/' .env

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Shell lint
        run: shellcheck -S error bin/start.sh app/entrypoint.sh

      - name: Validate compose
        run: ./bin/start.sh validate

      - name: Build image
        run: ./bin/start.sh build

      - name: Smoke tests
        run: tests/smoke.sh
